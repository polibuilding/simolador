# Publica o siMOLAdor no GitHub Pages a cada push na main.
# Os dados (catalog.json e kits.json) são sempre regerados a partir de data/parametros.xlsx.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Gerar dados a partir da planilha
        run: npm run dados
      - name: Testes
        run: npm test
      - name: Build
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # etiquetas das versões (v1.0, v1.1…) a partir de .github/versoes.txt
  versoes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Criar as etiquetas que faltam
        # precisa de Settings → Actions → General → Workflow permissions → "Read and write permissions"
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          criadas=0; falhas=0
          while read -r tag sha title; do
            case "$tag" in ''|'#'*) continue ;; esac
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              continue
            fi
            if ! out=$(git tag -a "$tag" "$sha" -m "siMOLAdor ${tag#v} — $title" 2>&1); then
              echo "::warning::Não deu para criar a etiqueta $tag ($sha): $out"; falhas=$((falhas+1)); continue
            fi
            if out=$(git push origin "refs/tags/$tag" 2>&1); then
              criadas=$((criadas+1))
            else
              echo "::warning::Não deu para enviar a etiqueta $tag: $(echo "$out" | tail -2 | tr '\n' ' ')"; falhas=$((falhas+1))
            fi
          done < .github/versoes.txt
          echo "::notice::Etiquetas criadas: $criadas; com problema: $falhas"

